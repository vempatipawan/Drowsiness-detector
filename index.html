<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes-closed alarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f9f9f9; --ink:#1a1a1a; --gray-1:#6b6b6b; --gray-3:#dcdcdc;
    --success:#1f7a4d; --danger:#c8322b;
    --radius:8px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Albert Sans", system-ui, sans-serif; font-size:15px; line-height:1.5;
    display:flex; justify-content:center;
    transition:background .2s;
  }
  body.alarm { background:var(--danger); color:#fff; }
  main { width:100%; max-width:440px; padding:28px 20px 40px; display:flex; flex-direction:column; gap:20px; }

  header h1 { font-size:18px; font-weight:600; margin:0; }
  header p { margin:4px 0 0; color:var(--gray-1); }
  body.alarm header p { color:rgba(255,255,255,.8); }

  .stage { position:relative; width:100%; aspect-ratio:4/3; border-radius:var(--radius);
           overflow:hidden; background:#111; border:1px solid var(--gray-3); }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; }
  .stage:not(.live) video { display:none; }
  .placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#8a8a8a; }
  .stage.live .placeholder { display:none; }

  .status { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
            padding:14px 0; border-top:1px solid var(--gray-3); border-bottom:1px solid var(--gray-3); }
  body.alarm .status { border-color:rgba(255,255,255,.35); }
  #status { font-size:26px; font-weight:600; line-height:1.1; margin:0; }
  .nums { display:flex; gap:18px; color:var(--gray-1); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nums b { color:inherit; font-weight:500; }
  body.alarm .nums { color:rgba(255,255,255,.85); }

  .btns { display:flex; gap:10px; }
  button { font:inherit; font-weight:500; padding:12px 18px; border-radius:var(--radius);
           border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; flex:1;
           transition:transform .15s; }
  button:active { transform:scale(.97); }
  button.secondary { background:transparent; color:var(--ink); }
  button.stop { background:transparent; color:var(--ink); }
  body.alarm button { border-color:#fff; background:#fff; color:var(--danger); }
  body.alarm button.secondary, body.alarm button.stop { background:transparent; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  body.alarm button:focus-visible { outline-color:#fff; }
  [hidden] { display:none !important; }

  details { border-top:1px solid var(--gray-3); padding-top:12px; color:var(--gray-1); }
  body.alarm details { border-color:rgba(255,255,255,.35); color:rgba(255,255,255,.85); }
  summary { cursor:pointer; font-weight:500; }
  details label { display:flex; align-items:center; gap:10px; margin-top:12px; }
  input[type=range] { flex:1; accent-color:var(--ink); }
  body.alarm input[type=range] { accent-color:#fff; }

  #msg { margin:0; color:var(--gray-1); }
  body.alarm #msg { color:rgba(255,255,255,.85); }

  @media (prefers-reduced-motion: reduce) { body, button { transition:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Eyes-closed alarm</h1>
    <p>Beeps if your eyes stay shut for one second.</p>
  </header>

  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="placeholder">Camera is off</div>
  </div>

  <div class="status">
    <p id="status">Ready</p>
    <div class="nums">
      <span>Openness <b id="ear">–</b></span>
      <span>Closed <b id="secs">0.0</b>s</span>
    </div>
  </div>

  <div class="btns">
    <button id="startBtn">Start camera</button>
    <button id="stopBtn" class="stop" hidden>Stop</button>
    <button id="calBtn" class="secondary" hidden>Recalibrate</button>
  </div>

  <p id="msg">Allow the camera, then keep your eyes open for two seconds so it can learn your normal eye shape.</p>

  <details>
    <summary>Sensitivity</summary>
    <label>Alarm below
      <input type="range" id="thresh" min="0.10" max="0.35" step="0.01" value="0.21">
      <span id="threshVal">0.21</span>
    </label>
  </details>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------- Settings you can tweak ----------
const CLOSED_SECONDS = 1.0;   // how long eyes must stay closed before the alarm
const CALIB_SECONDS  = 2.0;   // how long we watch your open eyes at the start
const CALIB_FRACTION = 0.7;   // threshold = 70% of your normal open-eye value

// Landmark numbers from MediaPipe's 478-point face mesh.
// Order: [outer corner, top1, top2, inner corner, bottom2, bottom1]
const RIGHT_EYE = [33, 160, 158, 133, 153, 144];
const LEFT_EYE  = [362, 385, 387, 263, 373, 380];

// ---------- Page elements ----------
const $ = id => document.getElementById(id);
const video = $("video"), stage = $("stage"), statusEl = $("status");
const earEl = $("ear"), secsEl = $("secs"), msg = $("msg");
const thresh = $("thresh"), threshVal = $("threshVal");
thresh.oninput = () => threshVal.textContent = (+thresh.value).toFixed(2);

// ---------- Math: Eye Aspect Ratio (EAR) ----------
// Open eye => about 0.3. Closed eye => close to 0.
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function eyeRatio(pts, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => pts[i]);
  return (dist(p2, p6) + dist(p3, p5)) / (2 * dist(p1, p4));
}

// ---------- Sound: a beep with no audio file ----------
let audioCtx, beepTimer = null;
function beepOnce() {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.value = 880; osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.value = 0.3; osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}
function startAlarm() { if (beepTimer) return; beepOnce(); beepTimer = setInterval(beepOnce, 400); document.body.classList.add("alarm"); }
function stopAlarm()  { clearInterval(beepTimer); beepTimer = null; document.body.classList.remove("alarm"); }

// ---------- Main loop ----------
let landmarker, stream, running = false, closedSince = null;
let calib = null;  // { start, samples: [] } while calibrating, null when done

function startCalibration() {
  calib = { start: performance.now(), samples: [] };
  closedSince = null; stopAlarm();
}

function stop() {
  running = false; stopAlarm();
  if (stream) stream.getTracks().forEach(t => t.stop());
  video.srcObject = null; stage.classList.remove("live");
  statusEl.textContent = "Stopped"; earEl.textContent = "–"; secsEl.textContent = "0.0";
  $("stopBtn").hidden = true; $("calBtn").hidden = true;
  $("startBtn").style.display = ""; $("startBtn").disabled = false;
}

async function start() {
  $("startBtn").disabled = true;
  statusEl.textContent = "Loading…";
  audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // must be created after a tap

  try {
    const files = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await FaceLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
      runningMode: "VIDEO", numFaces: 1
    });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = stream;
    await video.play();
    stage.classList.add("live");
  } catch (e) {
    statusEl.textContent = "Could not start";
    msg.textContent = "Open this file in Chrome/Safari over https or localhost and allow the camera. (" + e.message + ")";
    $("startBtn").disabled = false;
    return;
  }
  $("startBtn").style.display = "none";
  $("stopBtn").hidden = false; $("calBtn").hidden = false;
  running = true; startCalibration();
  requestAnimationFrame(loop);
}

function loop() {
  if (!running) return;
  const result = landmarker.detectForVideo(video, performance.now());
  const face = result.faceLandmarks[0];

  if (!face) {                       // no face visible: pause the timer, keep alarm off
    closedSince = null; stopAlarm();
    statusEl.textContent = "No face found"; earEl.textContent = "–"; secsEl.textContent = "0.0";
  } else {
    const ear = (eyeRatio(face, RIGHT_EYE) + eyeRatio(face, LEFT_EYE)) / 2;
    earEl.textContent = ear.toFixed(2);

    if (calib) {                     // learning your open-eye value
      calib.samples.push(ear);
      const left = CALIB_SECONDS - (performance.now() - calib.start) / 1000;
      statusEl.textContent = "Keep eyes open " + Math.max(0, left).toFixed(1) + "s";
      if (left <= 0) {
        const sorted = calib.samples.sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];   // median ignores blinks
        thresh.value = (median * CALIB_FRACTION).toFixed(2);
        threshVal.textContent = thresh.value;
        msg.textContent = "Your open-eye value is " + median.toFixed(2) + ", so the alarm triggers below " + thresh.value + ". Tap Recalibrate if you move the camera.";
        calib = null;
      }
    } else if (ear < +thresh.value) {       // eyes look closed
      closedSince ??= performance.now();
      const secs = (performance.now() - closedSince) / 1000;
      secsEl.textContent = secs.toFixed(1);
      statusEl.textContent = "Eyes closed";
      if (secs >= CLOSED_SECONDS) { startAlarm(); statusEl.textContent = "Wake up"; }
    } else {                         // eyes open: reset everything
      closedSince = null; stopAlarm();
      secsEl.textContent = "0.0"; statusEl.textContent = "Awake";
    }
  }
  requestAnimationFrame(loop);
}

$("startBtn").onclick = start;
$("stopBtn").onclick = stop;
$("calBtn").onclick = startCalibration;
</script>
</body>
</html>
